<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软工2502 抽号机</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Particle background -->
<canvas id="particleCanvas"></canvas>
<div class="scanlines"></div>

<!-- History toggle -->
<button class="btn-history" id="historyBtn" title="抽取记录 (H)">H</button>

<!-- History sidebar -->
<aside class="history-panel" id="historyPanel">
  <h3>抽 取 记 录</h3>
  <ul class="history-list" id="historyList">
    <li class="history-empty">暂无抽取记录</li>
  </ul>
</aside>

<!-- Main app -->
<main class="app">
  <header class="header">
    <div class="badge">Software Engineering · Class 2502</div>
    <h1>抽 号 机</h1>
    <p class="subtitle">软工2502班 · 共30人</p>
  </header>

  <div class="control-panel">
    <div class="control-group">
      <label for="countInput">抽取人数</label>
      <div class="num-input-wrap">
        <input type="number" id="countInput" value="1" min="1" max="30" autofocus>
      </div>
    </div>
    <button class="btn btn-primary" id="drawBtn">抽 取</button>
    <button class="btn btn-ghost" id="resetBtn">重 置</button>
  </div>

  <div class="rolling-area">
    <div class="rolling-text" id="rollingDisplay"></div>
  </div>

  <div class="result-area" id="resultArea"></div>

  <!-- Student roster -->
  <section class="roster-section">
    <div class="roster-header">
      <span class="line"></span>
      <span>全部学生</span>
      <span class="line"></span>
    </div>
    <div class="student-grid" id="studentGrid"></div>
  </section>

  <p class="kbd-hint">
    <span class="kbd">Space</span> / <span class="kbd">Enter</span> 抽取 &nbsp;
    <span class="kbd">R</span> 重置 &nbsp;
    <span class="kbd">H</span> 记录
  </p>
</main>

<script src="js/students.js"></script>
<script src="js/app.js"></script>
</body>
</html>
